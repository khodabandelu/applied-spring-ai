$kind: http-example
request:
  url: "{{baseUrl}}/actuator/health"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "groups": ["liveness", "readiness"],
        "status": "UP"
      }
order: 1000
