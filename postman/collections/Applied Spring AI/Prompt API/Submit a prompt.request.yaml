$kind: http-request
description: Submits a non-empty prompt. A successful request returns 201 Created with a JSON response.
url: "{{baseUrl}}/api/prompts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "prompt": "Explain why idempotency matters in distributed systems in one sentence."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has JSON content type", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response contains non-empty model text", function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property("response");
          pm.expect(body.response).to.be.a("string").and.not.empty;
      });
    language: text/javascript
examples: ./.resources/Submit a prompt.resources/examples
order: 1000
