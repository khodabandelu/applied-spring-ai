name: Bug report
description: Report reproducible behavior in an example or guide.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include API keys or other credentials.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prompt API
        - Build or CI
        - Documentation
        - Repository structure
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest set of steps needed to reproduce the behavior.
      placeholder: |
        1. Run ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "25"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, tokens, and personal information before pasting logs.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials and sensitive data from this report.
          required: true
